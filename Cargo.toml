[workspace]
members = ["."]
exclude = ["ballistics-engine-rb", "ballistics-engine-py"]

[package]
name = "ballistics-engine"
version = "0.33.3"
edition = "2021"
authors = ["Alex Jokela <email@tinycomputers.io>"]
description = "High-performance ballistics trajectory engine with professional physics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ajokela/ballistics-engine"
homepage = "https://ballistics.rs/"
documentation = "https://docs.rs/ballistics-engine"
keywords = ["ballistics", "trajectory", "physics", "simulation"]
categories = ["science", "simulation"]
exclude = [
    "app/",
    "tests/",
    "examples/",
    "ios.png",
    "pkg/",
    "pkg-web/",
    "pkg-nodejs/",
    "test_ffi.c",
    "test_monte_carlo.py",
    "ballistics_standalone.rs",
    "ballistics/",
    "ballistics",
    "src/main.rs",
    "src/bin/",
    "ballistics-engine-py/",
    "ballistics-engine-rb/",
    "ballistics-engine-rb.bak/",
    "BallisticsEngine.xcframework/",
    "BallisticsEngine.xcframework.bak/",
    "*.xcframework",
    "doc/",
    "target/",
    "*.bak",
    "releases/",
    "docs/superpowers/",
    ".cargo/",
    ".github/",
    "scripts/",
    "analyze_drift.md",
    "MCCOY_MIGRATION.md",
    "ADV_ISSUES-JUL1-2026.md",
    "MIPS_BUILD_NOTES.md",
    "test_drift.rs",
    "test_user_drift.html",
    "*.html",
    "data/ab_geometry/",
    "scripts/*ab_geometry*",
]

[features]
default = ["online", "pdf", "profile-import", "ffi", "cli", "bridge"]
# dirs is shared: the CLI (config/profile paths), the online BC-table cache, and the
# PDF dope card's font lookup all resolve user directories.
online = ["dep:ureq", "dep:dirs"]
pdf = ["dep:printpdf", "dep:dirs"]
# MBA-1331: dependencies used only by the `ballistics` binary (src/main.rs). Default-on
# so plain `cargo build/install` is unchanged; lib-only consumers (bindings, wasm) can
# drop them with default-features = false. The [[bin]] declares required-features, so a
# no-default-features build simply skips the binary.
cli = ["dep:clap", "dep:clap_complete", "dep:csv", "dep:dirs", "dep:strsim"]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
profile-import = []
# Versioned JSON command bridge (src/bridge/) — the mobile embedding surface.
# Pure serde/serde_json (already core deps). Its C ABI (src/bridge/ffi.rs) is
# additionally gated on `ffi`, so a no-ffi build keeps the pure-Rust bridge.
# Default-on: the mobile builds use --no-default-features and re-enable it.
bridge = []
# The C ABI (src/ffi.rs). Default-on so iOS/xcframework/staticlib/cdylib consumers keep the
# `ballistics_*` #[no_mangle] symbols. A downstream that links two versions of this crate into
# one binary (e.g. the differential fuzz target) must turn it off on the extra edge, since the
# no_mangle symbols would otherwise collide.
ffi = []
# --- WASM terminal command surface (src/wasm.rs) ---
# Each feature gates one top-level command of the browser terminal (`WasmBallistics::
# run_command`) plus that command's help text and its exclusive helpers. The `trajectory`
# command and the `Calculator` API are UNGATED — `Calculator` builds a `trajectory`
# command line internally, so it works with every one of these turned off.
#
# NOTE ON POLARITY: these are deliberately NOT in `default`. Every wasm32 build passes
# `--no-default-features` (the default `pdf`/`online` features don't compile for wasm32),
# so a default-on gate would be silently dropped from exactly the build it's meant to
# configure. The full terminal is `--features wasm-terminal`; see scripts/build-npm.sh
# and scripts/release/deploy-wasm.sh.
wasm-zero = []
wasm-lead = []
# Includes the `--wez` sweep sub-mode (Weapon Employment Zone), which has no separate gate:
# it is reachable only as a flag on `monte-carlo`.
wasm-monte-carlo = []
# `true-velocity` + `true-wind`: the two observed-data back-solvers share their result
# formatters, so they gate together.
wasm-truing = []
wasm-estimate-bc = []
wasm-bc-convert = []
wasm-drag-curve = []
wasm-reticle = []
wasm-powder = []
wasm-recoil = []
wasm-power-factor = []
# Everything the ballistics.sh browser terminal ships. This is what the WASM build scripts
# pass; consumers of the `Calculator` API alone need none of it.
wasm-terminal = [
    "wasm-zero",
    "wasm-lead",
    "wasm-monte-carlo",
    "wasm-truing",
    "wasm-estimate-bc",
    "wasm-bc-convert",
    "wasm-drag-curve",
    "wasm-reticle",
    "wasm-powder",
    "wasm-recoil",
    "wasm-power-factor",
]

# MBA-1318: gate the golden-reference physics validation harness (tests/golden_physics.rs).
# Non-default so the normal `cargo test` build stays fast and dependency-free; the harness
# uses only serde/serde_json, which are already core dependencies.
validation = []

[dependencies]
nalgebra = "0.35"
ndarray = "0.17"
ndarray-npy = "0.10"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: the bridge (src/bridge/) round-trips request/response floats
# through serde_json::Value; without this feature serde_json's fast float parser
# can be one ULP off re-reading its own shortest output (same defect class as the
# MBA-1413 fuzz finding), silently perturbing solver inputs across the JSON hop.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
clap = { version = "4.5", features = ["derive"], optional = true }
clap_complete = { version = "4", optional = true }
csv = { version = "1.3", optional = true }
thiserror = "2.0"
rand = "0.10"
rand_distr = "0.6"
dirs = { version = "6.0", optional = true }
strsim = { version = "0.11", optional = true }

# PDF generation for dope cards (optional, not WASM compatible)
# default-features=false drops the `html` feature (azul-layout -> rust-fontconfig
# -> mmapio, which is Linux-only via MAP_LOCKED and breaks all BSD targets).
printpdf = { version = "0.12", optional = true, default-features = false }

# Optional: HTTP client for online mode
ureq = { version = "3.1", optional = true, features = ["json"] }

# Optional: Alternative allocators for benchmarking
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }
mimalloc = { version = "0.1", optional = true }

# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
approx = "0.5"
wasm-bindgen-test = "0.3"

# criterion (0.8) pulls in Rayon, which hard-errors on wasm32 via its own compile_error!,
# breaking `wasm-pack test --node` for the entire WASM test harness. Benchmarks only ever
# run natively, so gate the dep to non-wasm targets (the [[bench]] below is native-only in
# practice — cargo never builds it for wasm32 during `--tests`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"

[[bin]]
name = "ballistics"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "trajectory_bench"
harness = false

[lib]
name = "ballistics_engine"
crate-type = ["rlib", "staticlib", "cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
