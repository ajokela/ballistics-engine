[workspace]
members = ["."]
exclude = ["ballistics-engine-rb", "ballistics-engine-py"]

[package]
name = "ballistics-engine"
version = "0.25.2"
edition = "2021"
authors = ["Alex Jokela <email@tinycomputers.io>"]
description = "High-performance ballistics trajectory engine with professional physics"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ajokela/ballistics-engine"
homepage = "https://ballistics.rs/"
documentation = "https://docs.rs/ballistics-engine"
keywords = ["ballistics", "trajectory", "physics", "simulation"]
categories = ["science", "simulation"]
exclude = [
    "app/",
    "tests/",
    "examples/",
    "ios.png",
    "pkg/",
    "pkg-web/",
    "pkg-nodejs/",
    "test_ffi.c",
    "test_monte_carlo.py",
    "ballistics_standalone.rs",
    "ballistics/",
    "ballistics",
    "src/main.rs",
    "src/bin/",
    "ballistics-engine-py/",
    "ballistics-engine-rb/",
    "ballistics-engine-rb.bak/",
    "BallisticsEngine.xcframework/",
    "BallisticsEngine.xcframework.bak/",
    "*.xcframework",
    "doc/",
    "target/",
    "*.bak",
    "releases/",
    "docs/superpowers/",
    ".cargo/",
    ".github/",
    "scripts/",
    "analyze_drift.md",
    "MCCOY_MIGRATION.md",
    "ADV_ISSUES-JUL1-2026.md",
    "MIPS_BUILD_NOTES.md",
    "test_drift.rs",
    "test_user_drift.html",
    "*.html"
]

[features]
default = ["online", "pdf", "profile-import", "ffi"]
online = ["dep:ureq"]
pdf = ["dep:printpdf"]
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]
profile-import = []
# The C ABI (src/ffi.rs). Default-on so iOS/xcframework/staticlib/cdylib consumers keep the
# `ballistics_*` #[no_mangle] symbols. A downstream that links two versions of this crate into
# one binary (e.g. the differential fuzz target) must turn it off on the extra edge, since the
# no_mangle symbols would otherwise collide.
ffi = []
# MBA-1318: gate the golden-reference physics validation harness (tests/golden_physics.rs).
# Non-default so the normal `cargo test` build stays fast and dependency-free; the harness
# uses only serde/serde_json, which are already core dependencies.
validation = []

[dependencies]
nalgebra = "0.35"
ndarray = "0.17"
ndarray-npy = "0.10"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
csv = "1.3"
thiserror = "2.0"
rand = "0.10"
rand_distr = "0.6"
dirs = "6.0"
strsim = "0.11"

# PDF generation for dope cards (optional, not WASM compatible)
# default-features=false drops the `html` feature (azul-layout -> rust-fontconfig
# -> mmapio, which is Linux-only via MAP_LOCKED and breaks all BSD targets).
printpdf = { version = "0.10", optional = true, default-features = false }

# Optional: HTTP client for online mode
ureq = { version = "3.1", optional = true, features = ["json"] }

# Optional: Alternative allocators for benchmarking
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.7", optional = true }
mimalloc = { version = "0.1", optional = true }

# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
approx = "0.5"
wasm-bindgen-test = "0.3"

# criterion (0.8) pulls in Rayon, which hard-errors on wasm32 via its own compile_error!,
# breaking `wasm-pack test --node` for the entire WASM test harness. Benchmarks only ever
# run natively, so gate the dep to non-wasm targets (the [[bench]] below is native-only in
# practice — cargo never builds it for wasm32 during `--tests`).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.8"

[[bin]]
name = "ballistics"
path = "src/main.rs"

[[bench]]
name = "trajectory_bench"
harness = false

[lib]
name = "ballistics_engine"
crate-type = ["rlib", "staticlib", "cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
