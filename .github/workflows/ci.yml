name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust quality and protocol compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Check changed-file whitespace
        shell: bash
        # Passed through env rather than interpolated into the script body. These are all
        # SHA-valued and so not a realistic injection vector, but keeping every ${{ }} out of
        # `run:` is the rule that does not require re-deciding which fields are safe.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Pick a base that actually exists in this checkout before diffing against it.
          #
          # A force-push (amending a commit message, say) leaves github.event.before pointing at
          # a commit the remote no longer has. `git diff --check A...B` then dies with
          # "Invalid symmetric difference expression" and exit 128, and the step reports a
          # whitespace failure that has nothing to do with whitespace — which is exactly what
          # happened on the 0.30.0 train. fetch-depth is 0, so HEAD^ is always available as a
          # fallback and still checks the commit that actually triggered this run.
          base=""
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base="$PUSH_BEFORE_SHA"
          fi

          # Two distinct force-push failure modes, not one.
          #
          # The first (handled since the 0.30.0 train) is the base commit being GONE:
          # `git diff --check A...B` dies with "Invalid symmetric difference expression".
          #
          # The second is the base still being FETCHABLE but no longer an ancestor, which is
          # what an amend-and-retag produces. A...B is a symmetric difference, so it diffs
          # from the MERGE-BASE rather than from A. On 2026-08-18 that reached back 318 files
          # and reported 28 trailing-whitespace hits in vendored fonts/ and
          # BallisticsEngine.xcframework/ binaries, none of which the push touched -- it was a
          # one-line rustdoc fix. `git diff --check A B` over the same pair reports nothing.
          #
          # So require the base to be an ancestor before trusting the three-dot form.
          if [[ -n "$base" ]] && git cat-file -e "${base}^{commit}" 2>/dev/null \
             && git merge-base --is-ancestor "$base" "$HEAD_SHA" 2>/dev/null; then
            git diff --check "${base}...${HEAD_SHA}"
          else
            echo "Base commit ${base:-<none>} is missing or not an ancestor of ${HEAD_SHA}" \
                 "(force-push, retag, or first push); falling back to HEAD^..HEAD."
            git diff --check HEAD^ HEAD
          fi

      # Build the feature-complete named binary before integration tests. A few legacy PDF tests
      # execute target/debug/ballistics directly instead of CARGO_BIN_EXE_ballistics.
      - name: Build all targets and features
        run: cargo build --locked --all-targets --all-features

      - name: Test all targets and features
        run: cargo test --locked --all-targets --all-features

      - name: Strict Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Strict Clippy for fuzz support code
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --lib --tests -- -D warnings

      - name: Build documentation
        run: RUSTDOCFLAGS=-Dwarnings cargo doc --locked --no-deps --all-features

      - name: Type-check the WASM surface and its tests
        # src/wasm.rs (and wasm_tests.rs) are cfg(target_arch = "wasm32")-gated, so every host
        # step above compiles NONE of them — a type error in the browser terminal reached main
        # green until this step existed. This is the same check developers run locally as the
        # fourth gate; executing the browser-gated tests would need a headless browser, so
        # type-checking is the floor CI can hold cheaply. --no-default-features matches the
        # wasm-pack release build (the default pdf/online features do not compile for wasm32).
        run: cargo check --locked --target wasm32-unknown-unknown --no-default-features --tests

      - name: Verify the offline minimal-feature process protocol
        # MBA-1331: the binary is behind the default-on `cli` feature ([[bin]]
        # required-features), so the offline-minimal check must enable it explicitly
        # or the spawned CARGO_BIN_EXE_ballistics does not exist (or worse, a stale
        # all-features binary from the earlier build step gets exercised instead).
        run: cargo test --locked --no-default-features --features cli --test solve_json_cli

      # MBA-1318: the golden-reference physics validation harness. The all-features test step above
      # already exercises it (the `validation` feature is on under --all-features), but run it
      # explicitly so a physics regression is reported as its own named, obvious check.
      - name: Golden-reference physics validation
        run: cargo test --locked --features validation --test golden_physics

  fuzz-smoke:
    name: Build and smoke-run every fuzz target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Test fuzz support code and frozen reproducers
        run: cargo +nightly test --locked --manifest-path fuzz/Cargo.toml --lib --tests

      - name: Build and smoke-run fuzz targets
        run: scripts/fuzz-smoke.sh
