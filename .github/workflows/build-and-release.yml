name: Build and Release All Platforms

# Two triggers, one contract:
#  - push of a v* tag: build ALL hosted platforms FROM THE TAG, create the GitHub
#    release with CHANGELOG-derived notes. This is the normal release path; the
#    private ballistics-release repo picks up from here for fleet platforms and
#    channel publishing (no publishing secrets live in this public repo).
#  - workflow_dispatch: manual/partial builds, same version gates.
#
# Every job gates on the built binary printing exactly "ballistics <version>" ON
# its target (Rosetta for macOS x86_64 on arm runners, qemu for linux-aarch64,
# inside the VM for the BSDs). Stale or mis-versioned binaries have nearly shipped
# twice; the gate is the point.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (must match Cargo.toml at the ref)'
        required: true
      platforms:
        description: 'Platforms (comma-separated: macos,linux,windows,bsd)'
        required: true
        default: 'macos,linux,windows,bsd'

# Default every job to read-only; only create-release is granted write (below), so a
# compromised build-job dependency can't push to the repo. The default token is read-only,
# which 403'd on gh release create during v0.25.1.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
    - uses: actions/checkout@v7
    - name: Derive and cross-check the version
      id: v
      env:
        EVENT: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        INPUT_VERSION: ${{ github.event.inputs.version }}
      run: |
        if [ "$EVENT" = "push" ]; then
          VERSION="${REF_NAME#v}"
          echo "is_tag=true" >> "$GITHUB_OUTPUT"
        else
          VERSION="$INPUT_VERSION"
          echo "is_tag=false" >> "$GITHUB_OUTPUT"
        fi
        CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
        if [ "$VERSION" != "$CARGO_VERSION" ]; then
          echo "::error::version mismatch: building '$VERSION' but Cargo.toml at this ref says '$CARGO_VERSION'. Tag the bumped commit."
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prep
    if: github.event_name == 'push' || contains(github.event.inputs.platforms, 'macos')
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            arch: x86_64
          - target: aarch64-apple-darwin
            arch: aarch64

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      run: |
        cargo build --release --locked --target ${{ matrix.target }}
        cp target/${{ matrix.target }}/release/ballistics ./ballistics-${VERSION}-macos-${{ matrix.arch }}
        # Two-space, bare-filename form so `shasum -c` / `sha256sum -c` accept it.
        shasum -a 256 ballistics-${VERSION}-macos-${{ matrix.arch }} > ballistics-${VERSION}-macos-${{ matrix.arch }}.sha256

    - name: Version gate
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      # macos-latest runners are arm64 with Rosetta installed, so both arches execute.
      run: |
        GOT=$(./ballistics-${VERSION}-macos-${{ matrix.arch }} --version)
        [ "$GOT" = "ballistics $VERSION" ] || { echo "::error::version gate: '$GOT' != 'ballistics $VERSION'"; exit 1; }

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: macos-${{ matrix.arch }}
        path: |
          ballistics-*-macos-*

  build-linux:
    needs: prep
    if: github.event_name == 'push' || contains(github.event.inputs.platforms, 'linux')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
            use_cross: true

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      if: matrix.use_cross
      run: cargo install cross

    - name: Install musl tools
      if: matrix.arch == 'x86_64'
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Set up QEMU (for the aarch64 version gate)
      if: matrix.use_cross
      uses: docker/setup-qemu-action@v3

    - name: Build with cargo
      if: '!matrix.use_cross'
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      run: |
        cargo build --release --locked --target ${{ matrix.target }}
        cp target/${{ matrix.target }}/release/ballistics ./ballistics-${VERSION}-linux-${{ matrix.arch }}

    - name: Build with cross
      if: matrix.use_cross
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      run: |
        cross build --release --locked --target ${{ matrix.target }}
        cp target/${{ matrix.target }}/release/ballistics ./ballistics-${VERSION}-linux-${{ matrix.arch }}

    - name: Version gate
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      run: |
        BIN=./ballistics-${VERSION}-linux-${{ matrix.arch }}
        if [ "${{ matrix.arch }}" = "x86_64" ]; then
          GOT=$("$BIN" --version)
        else
          # musl-static binary executes in any arm64 container under qemu.
          GOT=$(docker run --rm --platform linux/arm64 -v "$PWD:/w" alpine /w/ballistics-${VERSION}-linux-aarch64 --version)
        fi
        [ "$GOT" = "ballistics $VERSION" ] || { echo "::error::version gate: '$GOT' != 'ballistics $VERSION'"; exit 1; }

    - name: Generate checksums
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      run: |
        # Two-space, bare-filename form so `sha256sum -c` accepts it.
        sha256sum ballistics-${VERSION}-linux-${{ matrix.arch }} > ballistics-${VERSION}-linux-${{ matrix.arch }}.sha256

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: linux-${{ matrix.arch }}
        path: |
          ballistics-*-linux-*

  build-windows:
    needs: prep
    if: github.event_name == 'push' || contains(github.event.inputs.platforms, 'windows')
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Build
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      run: |
        cargo build --release --locked --target x86_64-pc-windows-msvc
        Copy-Item target\x86_64-pc-windows-msvc\release\ballistics.exe .\ballistics-$env:VERSION-windows-x86_64.exe

    - name: Version gate
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      run: |
        $got = (& .\ballistics-$env:VERSION-windows-x86_64.exe --version) | Out-String
        $got = $got.Trim()
        if ($got -ne "ballistics $env:VERSION") {
          Write-Error "version gate: '$got' != 'ballistics $env:VERSION'"
          exit 1
        }

    - name: Generate checksum
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      run: |
        # Two-space, bare-filename form so `shasum -c` accepts it. ASCII, no BOM,
        # trailing newline - Out-File's default UTF8-with-BOM breaks `-c` parsing.
        $hash = Get-FileHash -Path ballistics-$env:VERSION-windows-x86_64.exe -Algorithm SHA256
        $line = $hash.Hash.ToLower() + "  ballistics-$env:VERSION-windows-x86_64.exe`n"
        [System.IO.File]::WriteAllText("ballistics-$env:VERSION-windows-x86_64.exe.sha256", $line, (New-Object System.Text.ASCIIEncoding))

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-x86_64
        path: |
          ballistics-*-windows-*

  build-freebsd:
    needs: prep
    if: github.event_name == 'push' || contains(github.event.inputs.platforms, 'bsd')
    runs-on: ubuntu-latest
    name: Build FreeBSD binary

    steps:
    - uses: actions/checkout@v7

    - name: Build in FreeBSD VM
      uses: cross-platform-actions/action@5ea7e8e4677bd726033a10b094ba1c5762b15dee  # v1.3.0
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      with:
        operating_system: freebsd
        version: '14.0'
        architecture: x86-64
        environment_variables: VERSION
        run: |
          # Install Rust
          sudo pkg install -y rust git

          # Build the project
          cargo build --release --locked

          # Version gate, inside the VM, on the target OS
          GOT=$(target/release/ballistics --version)
          [ "$GOT" = "ballistics ${VERSION}" ] || { echo "version gate: '$GOT'"; exit 1; }

          # Create versioned binary + checksum
          cp target/release/ballistics ./ballistics-${VERSION}-freebsd-x86_64
          # BSD sha256(1) emits tag format with a ./ path; normalize to the
          # two-space bare-filename convention the rest of the release uses.
          sha256 -q ./ballistics-${VERSION}-freebsd-x86_64 \
            | awk -v f="ballistics-${VERSION}-freebsd-x86_64" '{print $1"  "f}' \
            > ./ballistics-${VERSION}-freebsd-x86_64.sha256

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: freebsd-x86_64
        path: |
          ballistics-*-freebsd-*

  build-netbsd:
    needs: prep
    if: github.event_name == 'push' || contains(github.event.inputs.platforms, 'bsd')
    runs-on: ubuntu-latest
    name: Build NetBSD binary

    steps:
    - uses: actions/checkout@v7

    - name: Build in NetBSD VM
      uses: cross-platform-actions/action@5ea7e8e4677bd726033a10b094ba1c5762b15dee  # v1.3.0
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      with:
        operating_system: netbsd
        version: '10.0'
        architecture: x86-64
        environment_variables: VERSION
        run: |
          # Install Rust
          sudo pkgin -y install rust git

          # Build the project
          cargo build --release --locked

          # Version gate, inside the VM, on the target OS
          GOT=$(target/release/ballistics --version)
          [ "$GOT" = "ballistics ${VERSION}" ] || { echo "version gate: '$GOT'"; exit 1; }

          # Create versioned binary + checksum
          cp target/release/ballistics ./ballistics-${VERSION}-netbsd-x86_64
          # BSD sha256(1) emits tag format with a ./ path; normalize to the
          # two-space bare-filename convention the rest of the release uses.
          sha256 -q ./ballistics-${VERSION}-netbsd-x86_64 \
            | awk -v f="ballistics-${VERSION}-netbsd-x86_64" '{print $1"  "f}' \
            > ./ballistics-${VERSION}-netbsd-x86_64.sha256

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: netbsd-x86_64
        path: |
          ballistics-*-netbsd-*

  build-openbsd:
    needs: prep
    if: github.event_name == 'push' || contains(github.event.inputs.platforms, 'bsd')
    runs-on: ubuntu-latest
    name: Build OpenBSD binary

    steps:
    - uses: actions/checkout@v7

    - name: Build in OpenBSD VM
      uses: cross-platform-actions/action@5ea7e8e4677bd726033a10b094ba1c5762b15dee  # v1.3.0
      env:
        VERSION: ${{ needs.prep.outputs.version }}
      with:
        operating_system: openbsd
        version: '7.8'
        architecture: x86-64
        environment_variables: VERSION
        run: |
          # Install Rust
          sudo pkg_add -I rust git

          # OpenBSD's default login-class datasize limit is too low for a release
          # rustc/LLVM build; raise the soft limit to the hard cap for this shell.
          ulimit -d "$(ulimit -dH)" 2>/dev/null || true

          # Build the project
          cargo build --release --locked

          # Version gate, inside the VM, on the target OS
          GOT=$(target/release/ballistics --version)
          [ "$GOT" = "ballistics ${VERSION}" ] || { echo "version gate: '$GOT'"; exit 1; }

          # Create versioned binary + checksum
          cp target/release/ballistics ./ballistics-${VERSION}-openbsd-x86_64
          # BSD sha256(1) emits tag format with a ./ path; normalize to the
          # two-space bare-filename convention the rest of the release uses.
          sha256 -q ./ballistics-${VERSION}-openbsd-x86_64 \
            | awk -v f="ballistics-${VERSION}-openbsd-x86_64" '{print $1"  "f}' \
            > ./ballistics-${VERSION}-openbsd-x86_64.sha256

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: openbsd-x86_64
        path: |
          ballistics-*-openbsd-*

  create-release:
    needs: [prep, build-macos, build-linux, build-windows, build-freebsd, build-netbsd, build-openbsd]
    # Run when nothing failed (skipped partial-dispatch jobs are fine); never create a
    # release from a red build. The old `if: always()` could publish over failures.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Prepare and verify release files
      env:
        VERSION: ${{ needs.prep.outputs.version }}
        IS_TAG: ${{ needs.prep.outputs.is_tag }}
      run: |
        find artifacts -type f -name "ballistics-*" -exec mv {} . \; 2>/dev/null || true
        echo "Release files:"; ls -la ballistics-* || true
        # Every .sha256 must be in the parseable two-space form AND verify. This is the
        # end-to-end check that the format drift (three different formats across the
        # matrix) can never come back silently.
        shasum -c ./*.sha256
        # On a tag build, all 8 hosted binaries are mandatory (16 files with checksums).
        if [ "$IS_TAG" = "true" ]; then
          COUNT=$(ls ballistics-${VERSION}-* 2>/dev/null | wc -l)
          if [ "$COUNT" -lt 16 ]; then
            echo "::error::expected 16 hosted release files (8 binaries + 8 checksums), found $COUNT"
            exit 1
          fi
        fi

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ needs.prep.outputs.version }}
        IS_TAG: ${{ needs.prep.outputs.is_tag }}
      run: |
        # Notes come from the CHANGELOG section for this version (the runbook keeps
        # [Unreleased] current during development); fall back to a generic stub only
        # if extraction fails, and say so.
        if scripts/release/extract-notes.sh "$VERSION" > release-notes.md 2>/dev/null; then
          :
        else
          echo "Release v${VERSION}. (CHANGELOG section missing - fix CHANGELOG.md.)" > release-notes.md
        fi
        {
          echo ""
          echo "### Installation"
          echo '```bash'
          echo "curl --proto '=https' --tlsv1.2 -sSf https://ballistics.zip | sh"
          echo '```'
        } >> release-notes.md

        # A dispatch run builds the DISPATCHED REF, not the tag — and main's
        # Cargo.toml holds the released version between bumps, so prep's version
        # cross-check passes for an already-released version. Without this guard the
        # create-then-clobber fallback would silently replace published, verified
        # release assets with branch-HEAD bytes (plus freshly matching checksums, so
        # nothing downstream could notice). Tag runs publish; dispatch runs may only
        # create something that does not exist yet, and only as a draft.
        if [ "$IS_TAG" = "true" ]; then
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            ballistics-* || \
          gh release upload "v${VERSION}" ballistics-* --clobber
        else
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::release v${VERSION} already exists. A dispatch build comes from the dispatched ref, not the tag, and must never overwrite published assets. Re-run the tag workflow, or replace assets deliberately by hand."
            exit 1
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --draft \
            ballistics-*
        fi
