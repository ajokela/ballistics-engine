name: Build Python Wheels

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.13.3)'
        required: true
      platforms:
        description: 'Platforms to build (comma-separated: linux,macos,windows)'
        required: true
        default: 'linux,macos,windows'
  push:
    tags:
      - 'v*'

jobs:
  build-linux-wheels:
    if: contains(github.event.inputs.platforms, 'linux') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Checkout ballistics-engine-py
      uses: actions/checkout@v4
      with:
        repository: ajokela/ballistics-engine-py
        path: ballistics-engine-py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Build Linux x86_64 wheel
      run: |
        cd ballistics-engine-py
        maturin build --release -i python${{ matrix.python-version }}

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-linux-x86_64-py${{ matrix.python-version }}
        path: target/wheels/*.whl

  build-macos-wheels:
    if: contains(github.event.inputs.platforms, 'macos') || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        target: ['x86_64-apple-darwin', 'aarch64-apple-darwin']

    steps:
    - uses: actions/checkout@v4

    - name: Checkout ballistics-engine-py
      uses: actions/checkout@v4
      with:
        repository: ajokela/ballistics-engine-py
        path: ballistics-engine-py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install maturin
      run: pip install maturin

    - name: Build macOS wheel
      run: |
        cd ballistics-engine-py
        maturin build --release --target ${{ matrix.target }} -i python${{ matrix.python-version }}

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-macos-${{ matrix.target }}-py${{ matrix.python-version }}
        path: target/wheels/*.whl

  build-windows-wheels:
    if: contains(github.event.inputs.platforms, 'windows') || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Checkout ballistics-engine-py
      uses: actions/checkout@v4
      with:
        repository: ajokela/ballistics-engine-py
        path: ballistics-engine-py

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Install maturin
      run: pip install maturin

    - name: Build Windows wheel
      run: |
        cd ballistics-engine-py
        maturin build --release --target x86_64-pc-windows-msvc -i python

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-windows-x86_64-py${{ matrix.python-version }}
        path: target/wheels/*.whl

  collect-wheels:
    needs: [build-linux-wheels, build-macos-wheels, build-windows-wheels]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        path: wheels/
        pattern: wheel-*

    - name: List all wheels
      run: |
        echo "Built wheels:"
        find wheels -name "*.whl" -type f
        echo ""
        echo "Total wheels: $(find wheels -name '*.whl' -type f | wc -l)"

    - name: Upload combined wheels artifact
      uses: actions/upload-artifact@v4
      with:
        name: all-python-wheels
        path: wheels/**/*.whl
