[package]
name = "ballistics-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Detach from the parent workspace so `cargo build` at the repo root ignores this crate.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ballistics-engine = { path = ".." }
engine_prev = { package = "ballistics-engine", version = "=0.21.5" }

[lib]
path = "src/lib.rs"

[profile.release]
debug = 1

[[bin]]
name = "robustness_inputs"
path = "fuzz_targets/robustness_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "robustness_ffi"
path = "fuzz_targets/robustness_ffi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "robustness_montecarlo"
path = "fuzz_targets/robustness_montecarlo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invariant_monotonic"
path = "fuzz_targets/invariant_monotonic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "invariant_symmetry"
path = "fuzz_targets/invariant_symmetry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential_prev"
path = "fuzz_targets/differential_prev.rs"
test = false
doc = false
bench = false

[[bin]]
name = "analytic_vacuum"
path = "fuzz_targets/analytic_vacuum.rs"
test = false
doc = false
bench = false

[[bin]]
name = "solver_zero"
path = "fuzz_targets/solver_zero.rs"
test = false
doc = false
bench = false
