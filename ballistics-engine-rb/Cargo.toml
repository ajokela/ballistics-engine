[workspace]
# Empty workspace to prevent inheriting from parent

[package]
name = "ballistics-engine-rb"
version = "0.13.3"
edition = "2021"
authors = ["Alex Jokela <email@tinycomputers.io>"]
description = "Ruby bindings for ballistics-engine"
license = "MIT OR Apache-2.0"

[lib]
name = "ballistics_engine_rb"
crate-type = ["cdylib"]

[dependencies]
ballistics-engine = { git = "https://github.com/ajokela/ballistics-engine", tag = "v0.13.3" }
magnus = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
